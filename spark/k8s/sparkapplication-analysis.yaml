apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: pyspark-analysis
  namespace: default
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: swr.cn-north-4.myhuaweicloud.com/cloud-course-2026/spark-analysis:v1
  imagePullPolicy: Always
  imagePullSecrets:
    - swr-secret
  mainApplicationFile: local:///opt/spark/work/analysis.py
  sparkVersion: "3.4.0"
  restartPolicy:
    type: Never
  driver:
    cores: 1
    memory: "1g"
    serviceAccount: spark
    env:
      - name: DATASET_TYPE
        value: "douban"
      - name: INPUT_PATH
        value: "s3a://cloud-course-2026-bucket/datasets/douban_movies.csv"
      - name: OUTPUT_PATH
        value: "s3a://cloud-course-2026-bucket/output/douban-analysis"
      - name: OBS_AK
        valueFrom:
          secretKeyRef:
            name: spark-obs-secret
            key: OBS_AK
      - name: OBS_SK
        valueFrom:
          secretKeyRef:
            name: spark-obs-secret
            key: OBS_SK
      - name: OBS_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: spark-obs-secret
            key: OBS_ENDPOINT
  executor:
    cores: 1
    coreRequest: "200m"
    instances: 2
    memory: "1g"
    memoryOverhead: "256m"
    env:
      - name: DATASET_TYPE
        value: "douban"
      - name: INPUT_PATH
        value: "s3a://cloud-course-2026-bucket/datasets/douban_movies.csv"
      - name: OUTPUT_PATH
        value: "s3a://cloud-course-2026-bucket/output/douban-analysis"
      - name: OBS_AK
        valueFrom:
          secretKeyRef:
            name: spark-obs-secret
            key: OBS_AK
      - name: OBS_SK
        valueFrom:
          secretKeyRef:
            name: spark-obs-secret
            key: OBS_SK
      - name: OBS_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: spark-obs-secret
            key: OBS_ENDPOINT
