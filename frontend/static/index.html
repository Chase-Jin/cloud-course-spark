<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>云计算技术课程设计</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 40px; background: #f7f8fa; color: #222; }
    main { max-width: 760px; margin: auto; background: white; padding: 32px; border-radius: 16px; box-shadow: 0 8px 28px rgba(0,0,0,.08); }
    code { background: #f1f3f5; padding: 2px 6px; border-radius: 6px; }
    .ok { color: #137333; font-weight: 700; }
    .bad { color: #c5221f; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>云计算技术课程设计</h1>
    <p>学号：<strong>&lt;STUDENT_ID&gt;</strong></p>
    <p>姓名：<strong>&lt;STUDENT_NAME&gt;</strong></p>
    <p>前端：Nginx 静态页</p>
    <p>后端 API：<code>/api/ping</code></p>
    <p>后端通信状态：<span id="status">检测中...</span></p>
    <pre id="payload"></pre>
  </main>
  <script>
    async function checkBackend() {
      const status = document.getElementById('status');
      const payload = document.getElementById('payload');
      try {
        const res = await fetch('/api/ping');
        const json = await res.json();
        status.textContent = json.status === 'ok' ? '正常' : '异常';
        status.className = json.status === 'ok' ? 'ok' : 'bad';
        payload.textContent = JSON.stringify(json, null, 2);
      } catch (e) {
        status.textContent = '异常：' + e.message;
        status.className = 'bad';
      }
    }
    checkBackend();
  </script>
</body>
</html>
